services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
    environment:
      ES_JAVA_OPTS: "-Xms1024m -Xmx1024m"
    volumes:
      - "./dev/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml"
    ports:
      - "9200:9200"
  imgops:
    build:
      context: ./dev/imgops
    ports:
      - "9008:80"
    volumes:
      - "./dev/imgops/nginx.conf:/etc/nginx/nginx.conf"
  imgproxy:
    image: darthsim/imgproxy:latest
    ports:
      - "9016:8080"
    environment:
      # LOCAL DEV ONLY - unsigned/"insecure" requests are accepted so we don't need to implement URL signing
      # in application code yet. This MUST NOT be used in any deployed environment - see
      # bbc/src/imgProxy/imgproxy-ecs-fargate.yaml for the (signed) production-style deployment.
      IMGPROXY_ALLOW_INSECURE: "true"
      IMGPROXY_HEALTH_CHECK_PATH: /health
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      # Kahuna's <img crossorigin="anonymous"> preview tag makes a CORS-mode request, so the response needs an
      # Access-Control-Allow-Origin header or the browser will refuse to render the image ("CORS missing allow
      # origin"). "*" is fine for local dev; a real deployment should scope this to the actual Kahuna origin.
      IMGPROXY_ALLOW_ORIGIN: "*"
      # Source images are fetched over plain HTTP directly from the `localstack` container (see
      # com.gu.mediaservice.lib.imgproxy.ImgProxyUrlBuilder), so allow that as a source.
      IMGPROXY_ALLOWED_SOURCES: "http://localstack:4566/"
    depends_on:
      - localstack
  cerebro:
    image: lmenezes/cerebro
    ports:
      - "9090:9000"
  localstack:
    image: localstack/localstack:4.5.0
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    expose:
      - 4566 # provide the imgops/imgproxy containers with access to localstack's direct S3 endpoint
    environment:
      SERVICES: cloudformation,cloudwatch,dynamodb,kinesis,s3,sns,sqs,iam
      DEFAULT_REGION: eu-west-1
      KINESIS_ERROR_PROBABILITY: 0.0
    volumes:
      - "./dev/.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
  oidc-provider:
    build:
      context: ./dev/oidc-provider
    ports:
      - "9014:9014"
    volumes:
      - "./dev/config/users.json:/etc/grid/users.json"
    env_file: ./dev/.env
